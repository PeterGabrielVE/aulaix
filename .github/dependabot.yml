version: 2

updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      groups:
          composer-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly

    - package-ecosystem: docker
      directories:
          - /docker/php
          - /docker/node
          - /docker/ai-service
      schedule:
          interval: monthly

    - package-ecosystem: pip
      directory: /docker/ai-service
      schedule:
          interval: monthly
