name: CD

# main  -> CI -> build & push images (tag sha-<commit>) -> deploy staging
# vX.Y.Z -> promote the already-tested sha-<commit> images -> deploy production
on:
    push:
        branches: [main]
        tags: ['v*.*.*']

concurrency:
    group: cd-${{ github.ref }}
    # Never kill a pipeline halfway through a deploy.
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    ci:
        if: github.ref_type == 'branch'
        uses: ./.github/workflows/ci.yml

    build:
        name: Build & push images
        if: github.ref_type == 'branch'
        needs: ci
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                include:
                    - image: app
                      context: .
                      file: docker/php/Dockerfile.prod
                      target: app
                    - image: web
                      context: .
                      file: docker/php/Dockerfile.prod
                      target: web
                    - image: ai
                      context: docker/ai-service
                      file: docker/ai-service/Dockerfile
                      target: ''
        steps:
            - uses: actions/checkout@v4

            # GHCR image names must be lowercase (the owner is PeterGabrielVE).
            - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  target: ${{ matrix.target }}
                  push: true
                  tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=${{ matrix.image }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}

    deploy-staging:
        needs: build
        uses: ./.github/workflows/deploy.yml
        permissions:
            contents: read
            packages: read
        with:
            environment: staging
            image_tag: sha-${{ github.sha }}
        secrets: inherit

    # Build once, promote many: production runs the exact bytes that passed
    # CI and staging. Fails if the tagged commit never went through main.
    promote:
        name: Promote images to ${{ github.ref_name }}
        if: github.ref_type == 'tag'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Re-tag sha-${{ github.sha }} as ${{ github.ref_name }}
              run: |
                  for image in app web ai; do
                      docker buildx imagetools create \
                          --tag "$IMAGE_PREFIX/$image:$GITHUB_REF_NAME" \
                          "$IMAGE_PREFIX/$image:sha-$GITHUB_SHA"
                  done

    deploy-production:
        needs: promote
        uses: ./.github/workflows/deploy.yml
        permissions:
            contents: read
            packages: read
        with:
            environment: production
            image_tag: ${{ github.ref_name }}
        secrets: inherit
