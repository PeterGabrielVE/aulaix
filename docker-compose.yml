services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        # No `environment:` block here on purpose: APP_ENV etc. come from the
        # mounted .env file. Setting APP_ENV as a real container env var would
        # pre-populate PHP's $_ENV/$_SERVER before phpunit.xml's <env> runs,
        # and phpunit's `force="true"` only guarantees getenv() is overridden
        # — not $_ENV/$_SERVER, which Laravel's environment detection reads.
        # That mismatch silently kept the app in "local" during `artisan
        # test`, so CSRF's runningUnitTests() bypass never applied (419s).
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - aulaix

    nginx:
        image: nginx:1.27-alpine
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - aulaix

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        volumes:
            - .:/var/www/html
            # Shadows the bind mount above so the container's own
            # (Linux-native) node_modules wins — see docker/node/Dockerfile.
            - aulaix_node_modules:/var/www/html/node_modules
        ports:
            - "${VITE_PORT:-5173}:5173"
        networks:
            - aulaix

    postgres:
        image: postgres:16-alpine
        environment:
            - POSTGRES_DB=${DB_DATABASE:-aulaix}
            - POSTGRES_USER=${DB_ROOT_USERNAME:-postgres}
            - POSTGRES_PASSWORD=${DB_ROOT_PASSWORD:-postgres}
        volumes:
            - aulaix_pgdata:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql
        ports:
            - "${DB_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USERNAME:-postgres} -d ${DB_DATABASE:-aulaix}"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - aulaix

    redis:
        image: redis:7-alpine
        networks:
            - aulaix

    mailhog:
        image: mailhog/mailhog:latest
        ports:
            - "${MAILHOG_UI_PORT:-8025}:8025"
        networks:
            - aulaix

    ai-service:
        build:
            context: ./docker/ai-service
        ports:
            - "${AI_SERVICE_PORT:-8001}:8000"
        networks:
            - aulaix

networks:
    aulaix:
        driver: bridge

volumes:
    aulaix_pgdata:
        driver: local
    aulaix_node_modules:
        driver: local
