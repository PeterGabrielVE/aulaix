# Production nginx (image target "web" in docker/php/Dockerfile.prod).
# Accepts any host: the central domain and every {tenant}.APP_DOMAIN
# subdomain land here, and Laravel's routing resolves the tenant.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite output is content-hashed, so it can be cached forever.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
