; SPEC-015 RLT-NF01 (ADR 0011): a pool in transaction mode, like the one
; production may use. Each transaction, and each statement outside one, may
; go through a different server connection; one server connection per
; database makes a leak between clients show at once.
[databases]
aulaix = host=postgres port=5432 dbname=aulaix pool_size=1
aulaix_testing = host=postgres port=5432 dbname=aulaix_testing pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; No prepared statements cached across clients: a plan prepared before a
; migration fails afterwards ("cached plan must not change result type").
; PDO emulates them instead (DB_EMULATE_PREPARES, ADR 0011).
max_prepared_statements = 0
ignore_startup_parameters = extra_float_digits,options
server_reset_query =
