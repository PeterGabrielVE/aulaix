upload_max_filesize = 20M
post_max_size = 20M
memory_limit = 256M
max_execution_time = 120

; Bind-mounted code is slow to stat from inside Docker on Windows/macOS, so
; keep compiled scripts and resolved paths cached as long as practical while
; still picking up edits (timestamps are rechecked every 2s).
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
